<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>SGI Hello World TP1</title>

    <link rel="shortcut icon" href="image/favicon/3d.png" />
    <link rel="stylesheet" href="styles.css">

    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.156.1/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.156.1/examples/jsm/"
      }
    }
  </script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #282c34; /* Fundo escuro */
            overflow: hidden; /* Evita barras de rolagem */
        }

        #canvas {
            flex-grow: 1;
        }

        #text-box {
            position: absolute; /* Fixa a posição no canto inferior */
            bottom: 0; /* Alinha ao fundo */
            left: 0; /* Início à esquerda */
            width: 100%; /* Estende de ponta a ponta */
            background-color: rgba(0, 0, 0, 0.7); /* Fundo semitransparente */
            color: white; /* Cor do texto */
            font-size: 16px; /* Tamanho do texto menor */
            text-align: center; /* Centraliza o texto */
            padding: 10px 0; /* Espaçamento interno */
        }
    </style>
</head>

<body>
    <div id="canvas"></div>
    <div id="camera"></div>
    <div id="text-box">CandyCity - FEUP 2024/2025 - Ema Maria Monteiro Martins</div>
    <script type="module" src="main.js"></script>
</body>

</html>
